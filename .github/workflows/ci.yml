name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: ./build/boilerplate-cli-ui-cpp version

      - name: Report binary size
        run: |
          set -e
          BIN=$(echo "./build/boilerplate-cli-ui-cpp version" | awk '{print $1}')
          echo "binary=$BIN size=$(stat -c%s "$BIN") bytes"
